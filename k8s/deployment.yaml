apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-project-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-project-app
  template:
    metadata:
      labels:
        app: eks-project-app
    spec:
      containers:
      - name: eks-project-app
        image: 646322278086.dkr.ecr.eu-west-1.amazonaws.com/eks-project-app:45fe08f8cf300f6f62b2048b0c8fa1c13040b61d
        ports:
        - containerPort: 5000
