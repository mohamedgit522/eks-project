apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-project-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - eks.mohamedlab.co.uk
    secretName: eks-project-tls
  rules:
  - host: eks.mohamedlab.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eks-project-app
            port:
              number: 80
